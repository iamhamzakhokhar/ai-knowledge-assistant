[project]
name = "knowledge-assistant-ai"
version = "0.1.0"
description = "FastAPI service for the AI Knowledge Assistant portfolio project."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.2",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "redis==8.1.0",
  "rq==3.0.0",
  "sqlalchemy==2.1.8",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "knowledge_assistant/migrations"
"alembic.ini" = "knowledge_assistant/alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = ["integration: requires the isolated PostgreSQL and Redis Compose services"]

[tool.coverage.run]
source = ["knowledge_assistant"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
