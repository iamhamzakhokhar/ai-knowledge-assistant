name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Install JavaScript dependencies
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --directory services/ai --locked
      - name: Lint and formatting
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Production builds
        run: |
          pnpm build
          uv build --directory services/ai
      - name: Inject disposable test regression
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('services/ai/tests/test_ci_negative_control.py').write_text(
              'def test_intentional_ci_failure():\n    assert False, "Issue 3 disposable test control"\n'
          )
          PY
      - name: API unit tests
        run: uv run --directory services/ai pytest
      - name: Compose integration, coverage and recovery
        env:
          COMPOSE_PROJECT_NAME: aka-ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "43000"
          API_PORT: "48000"
        run: python scripts/compose_smoke.py
      - name: Stop disposable infrastructure
        if: always()
        env:
          COMPOSE_PROJECT_NAME: aka-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose --profile test down --volumes --remove-orphans
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser
